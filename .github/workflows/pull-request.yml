name: pull-request

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: archboard-report-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  proposal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          fetch-depth: 0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: miklschmidt/archboard-relay-example-infra
          path: platform
          fetch-depth: 0

      - name: Describe the architecture change
        uses: miklschmidt/archboard/actions/pull-request@6b90eb8f2aa343d69c79c9c47bbc6893194467fa # v0.3.0
        with:
          working-directory: app
          repos: |
            platform
          version: 0.3.0
          out-of-plan: warn
