name: architecture

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Smoke the parcel path
        run: npm run smoke

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: app

      - uses: actions/checkout@v5
        with:
          repository: miklschmidt/archboard-relay-example-infra
          path: platform

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check the architecture
        uses: miklschmidt/archboard/actions/check@docs/relay-cli-reference
        with:
          working-directory: app
          repos: |
            platform
          version: 0.1.0
          fail-on: warning
